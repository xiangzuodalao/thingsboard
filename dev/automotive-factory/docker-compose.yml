services:
  postgres:
    image: postgres:16
    container_name: tb-automotive-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TB_POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${TB_POSTGRES_DB}
      POSTGRES_USER: ${TB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TB_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - tb-automotive-postgres-data:/var/lib/postgresql/data

volumes:
  tb-automotive-postgres-data:
    name: tb-automotive-postgres-data
